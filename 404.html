<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Redirecting…</title>
<script>
// GitHub Pages: /NSD-Cluster-Ops-Dashboard/Morning-Tasks -> /NSD-Cluster-Ops-Dashboard/?/Morning-Tasks
var base = '/NSD-Cluster-Ops-Dashboard/';
var p = location.pathname.indexOf(base) === 0 ? location.pathname.slice(base.length) : location.pathname.replace(/^\//, '');
location.replace(base + '?/' + p.replace(/&/g, '~and~') + location.hash);
</script></head><body></body></html>
